server:
  port: 0

spring:
  application:
    name: order-service-test
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:h2:mem:order_db;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

catalog:
  service:
    url: http://localhost:8082
    mock-enabled: true

order:
  timeout:
    cron: "0 */5 * * * *"
    minutes: 15
