server:
  port: 8086

spring:
  application:
    name: notification-ai-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:quickshop}
    password: ${RABBITMQ_PASSWORD:quickshop123}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dev@quickshop.vn}
    password: ${MAIL_PASSWORD:mock_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

openai:
  api-key: ${OPENAI_API_KEY:mock-key}
  model: ${OPENAI_MODEL:gpt-4o-mini}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
