server:
  port: 8084

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:quickshop}
    password: ${RABBITMQ_PASSWORD:quickshop123}

vnpay:
  tmn-code: ${VNP_TMN_CODE:QUICKSHOP}
  hash-secret: ${VNP_HASH_SECRET:QUICKSHOPSECRETKEYVNPAY2026}
  payment-url: ${VNP_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNP_RETURN_URL:http://localhost:5173/payment/vnpay-return}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

payos:
  client-id: ${PAYOS_CLIENT_ID:0aac9506-4266-46ae-a23f-54f3ebde492c}
  api-key: ${PAYOS_API_KEY:fe0061b1-711b-4b0f-8470-b2f7fa2c3511}
  checksum-key: ${PAYOS_CHECKSUM_KEY:d0d7ac177459d2dedad4b48eeb82d867f0197350}
