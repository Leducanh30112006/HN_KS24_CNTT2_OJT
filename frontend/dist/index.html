      (function() {
        try {

          var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');

          if (theme === 'dark') {

            document.documentElement.classList.remove('dark');

        } catch (e) {}
      })();
