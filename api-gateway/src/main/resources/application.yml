server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
              - "X-Total-Count"
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: "#{@ipKeyResolver}"

      routes:
        # 1. Identity Service - Public Auth Endpoints (Đăng ký, Đăng nhập, OTP, Refresh Token)
        - id: identity-public-route
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # 2. Identity Service - Public Shop Browsing (Xem thông tin gian hàng)
        - id: identity-shops-public-route
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/shops, /api/shops/{id}, /api/shops/owner/{ownerId}
            - Method=GET
          filters:
            - StripPrefix=0

        # 3. Identity Service - Admin Shop Approval (Admin duyệt/từ chối gian hàng KYC)
        - id: identity-admin-shops-route
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/shops/*/approve, /api/shops/*/reject
            - Method=PUT
          filters:
            - name: JwtAuth
              args:
                requiredRole: ROLE_ADMIN
            - StripPrefix=0

        # 3b. Identity Service - Admin Audit Logs
        - id: identity-admin-audit-logs-route
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/audit-logs/**
          filters:
            - name: JwtAuth
              args:
                requiredRole: ROLE_ADMIN
            - StripPrefix=0

        # 4. Identity Service - Protected User & Shop Onboarding (Buyer, Seller, Admin)
        - id: identity-protected-route
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**, /api/shops/register
          filters:
            - name: JwtAuth
              args:
                allowedRoles: "ROLE_BUYER,ROLE_SELLER,ROLE_ADMIN"
            - StripPrefix=0

        # 5. Catalog Service - Public Catalog Browsing (Xem sản phẩm, danh mục, đánh giá)
        - id: catalog-service-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/catalog/**
          filters:
            - StripPrefix=0

        # 6. Order Service - Cart, Orders & Vouchers (Yêu cầu đăng nhập)
        - id: order-service-route
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**, /api/cart/**, /api/vouchers/**
          filters:
            - name: JwtAuth
              args:
                allowedRoles: "ROLE_BUYER,ROLE_SELLER,ROLE_ADMIN"
            - StripPrefix=0

        # 7a. Payment Service - Public Webhooks, Callbacks & Status (VNPay IPN, PayOS Webhook, Polling)
        - id: payment-public-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/vnpay/**, /api/payments/payos/**, /api/payments/status/**, /api/payments/vnpay-ipn, /api/payments/vnpay-return, /api/payments/vnpay-create
          filters:
            - StripPrefix=0

        # 7b. Payment Service - VNPay & Wallet (Yêu cầu đăng nhập)
        - id: payment-service-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**
          filters:
            - name: JwtAuth
              args:
                allowedRoles: "ROLE_BUYER,ROLE_SELLER,ROLE_ADMIN"
            - StripPrefix=0

        # 8. Shipping Service - Logistics & Tracking (Yêu cầu đăng nhập)
        - id: shipping-service-route
          uri: ${SHIPPING_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/shipping/**
          filters:
            - name: JwtAuth
              args:
                allowedRoles: "ROLE_BUYER,ROLE_SELLER,ROLE_ADMIN"
            - StripPrefix=0

        # 9. Notification & AI Chatbot Service
        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/notifications/**, /api/ai/**
          filters:
            - StripPrefix=0

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
